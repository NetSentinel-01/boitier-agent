[package]
name = "agent"
version = "0.1.0"
edition.workspace = true

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
backon = "1.6.0"
etherparse = "0.21.0"
nix = { version = "0.31.3", features = ["fs", "mman"] }
pcap = { version = "2.5.0", features = ["capture-stream"] }
pcap-file = "2.0.0"
protocol = { version = "0.1.0", path = "../protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple-dns = "0.12.0"
thiserror = "2.0.21"
tls-parser = "0.12.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zstd = "0.14.3"
